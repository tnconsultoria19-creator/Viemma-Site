    <script>
      // Suppress ResizeObserver loop errors/warnings to keep the container/test environment from detecting false failures
      window.addEventListener('error', function(e) {
        if (e && e.message && (
          e.message.indexOf('ResizeObserver loop completed') >= 0 ||
          e.message.indexOf('ResizeObserver loop limit') >= 0
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
